micronaut:
  application:
    name: tiendasegura-api
  server:
    port: ${PORT:8080}
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:5173
            - http://127.0.0.1:5173
            - https://tiendasegura.vercel.app
          allowed-origins-regex: '^https:\/\/tiendasegura-frontend.*\.vercel\.app$'
          allow-credentials: true
          exposed-headers: [Authorization]
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: '${JWT_SECRET:cAmBiAmE-en-pRoDuCcIoN-mInImO-256-bItS-dE-sEcReT}'
              jws-algorithm: HS256
        generator:
          refresh-token:
            enabled: true
            secret: '${JWT_REFRESH_SECRET:oTrO-sEcReT-dIfErEnTe-256-bItS}'
      generator:
        access-token:
          expiration: 28800
    intercept-url-map:
      - pattern: /**
        http-method: OPTIONS
        access: [isAnonymous()]
      - pattern: /auth/**
        http-method: POST
        access: [isAnonymous()]
      - pattern: /health
        access: [isAnonymous()]
datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/tiendasegura`}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    maximum-pool-size: 10
    minimum-idle: 2
    connection-init-sql: "SET app.tenant_id = '00000000-0000-0000-0000-000000000000'"
flyway:
  datasources:
    default:
      enabled: true
      locations: [classpath:db/migration]
      schemas: [public]
      baseline-on-migrate: true
      baseline-version: '0'
